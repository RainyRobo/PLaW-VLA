[project]
name = "libero-plus-example"
version = "0.1.0"
description = "Python environment definition for the openpi LIBERO-Plus evaluation client"
requires-python = ">=3.8,<3.9"
dependencies = [
    "bddl==1.0.1",
    "cloudpickle==2.1.0",
    "easydict==1.9",
    "einops==0.4.1",
    "future==0.18.2",
    "gym==0.25.2",
    "hydra-core==1.2.0",
    "imageio[ffmpeg]==2.35.1",
    "libero",
    "matplotlib==3.5.3",
    "numpy==1.22.4",
    "opencv-python==4.6.0.66",
    "openpi-client",
    "PyYAML==6.0.2",
    "robomimic==0.2.0",
    "robosuite==1.4.0",
    "scikit-image==0.21.0",
    "setuptools<81",
    "thop==0.1.1-2209072238",
    "torch==1.11.0+cu113",
    "tqdm==4.67.1",
    "transformers==4.21.1",
    "tyro==0.9.2",
    "usd-core>=25.5",
    "wand",
    "wandb==0.13.1",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
libero = { path = "../../third_party/libero-plus", editable = true }
openpi-client = { path = "../../packages/openpi-client", editable = true }
torch = { index = "pytorch-cu113" }

[[tool.uv.index]]
name = "pytorch-cu113"
url = "https://download.pytorch.org/whl/cu113"
explicit = true
