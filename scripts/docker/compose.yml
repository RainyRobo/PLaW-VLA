# Run with:
# docker compose -f scripts/docker/compose.yml up --build
services:
  policy_server:
    image: policy_server
    build:
      context: ../..
      dockerfile: scripts/docker/serve_policy.Dockerfile
    init: true
    tty: true
    network_mode: host
    # Mount the model/data cache inside the container.
    volumes:
      - $PWD:/app
      - ${DATA_HOME:-~/.cache/robot_policy}:/model_assets
    environment:
      - SERVER_ARGS
      - DATA_HOME=/model_assets

    # Comment out this block if not running on a machine with GPUs.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
