[project]
name = "data-converters"
version = "0.1.0"
description = "Local dataset conversion and LeRobot format upgrade tools"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.0.0,<5.0.0",
    "jsonlines",
    "h5py",
    "lerobot",
    "numpy>=1.22.4,<2.3.0",
    "numpydantic>=1.6.6",
    "pandas",
    "pyarrow",
    "ray",
    "rich>=14.0.0",
    "av",
    "tyro",
]

[tool.uv]
no-build-package = ["av"]
override-dependencies = ["av>=15.0.0"]

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "017ff73fbfe46bf9a673cd9b402988dcb79151f7" }
